<!doctype html>
<!-- GitHub's social preview, the card shown when the repo's link is shared: render.py loads this page at 1280 x 640
     into promo/out/social-preview.png, which is uploaded in the repo's Settings. The name and its line on the left; on the
     right two of the README's figures, each a signal that looks like an edge but doesn't clear the synthetic null
     ("The golden cross" and "Low bond yields"), over the README's headline stats (docs/stats-light.svg). GitHub crops
     a little off the edges in places, so the words, badges and stamps stay 56px clear of them; the stats card runs off the right and the bottom, so the
     card has no empty margin. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The icon's colours: its deep navy, its blues, and the cyan of its market line. */
  :root {
    --brand: linear-gradient(90deg, #b8fffb, #00f0ff 35%, #087cff);
    --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --text: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    --paper: #fcfcfb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative; font-family: var(--sans); color: #fff;
    background:
      radial-gradient(55% 75% at 0% 0%, rgba(33, 69, 232, 0.55), transparent 70%),
      radial-gradient(50% 70% at 100% 100%, rgba(114, 0, 217, 0.35), transparent 70%),
      linear-gradient(135deg, #0a1660 0%, #070d3a 55%, #040722 100%);
  }
  /* A faint chart grid, fading out behind the figures. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.6) 30%, transparent 55%);
  }
  .brand { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* The caption: icon beside the name and its line, the hook, and the badges. */
  .caption { position: absolute; left: 64px; top: 0; bottom: 0; width: 418px; display: flex; flex-direction: column; justify-content: center; }
  .app { display: flex; align-items: center; gap: 18px; }
  .app img { width: 84px; height: 84px; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5)); }
  .app b { display: block; font-size: 46px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
  .app small { display: block; margin-top: 4px; white-space: nowrap; font-size: 19px; font-weight: 500; color: rgba(255, 255, 255, 0.75); }
  h1 { margin: 40px 0 0; width: max-content; white-space: nowrap; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; }
  .caption p { margin: 20px 0 0; font: 400 23px/1.45 var(--text); color: rgba(255, 255, 255, 0.78); }

  /* The README's badges, in its order, under the line. */
  .badges { display: flex; gap: 10px; margin-top: 30px; align-items: center; }
  .badges img { display: block; height: 40px; }
  /* The right side, 700 x 528 inside the edges: two figures, fanned, over the stats. */
  .paper { position: absolute; border-radius: 12px; background: var(--paper); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .figure { width: 620px; padding: 8px 6px 2px; }
  /* Cut below the axis titles: the figure's footnote is too small to read on the card. */
  .figure .crop { overflow: hidden; aspect-ratio: 2899 / 1000; }
  .figure img { display: block; width: 100%; }
  .figure.back { left: 500px; top: 60px; }
  .figure.front { left: 604px; top: 204px; }
  /* Each figure's verdict, as its title states it, and the swing the README quotes. */
  .stamp {
    position: absolute; right: -12px; top: -16px; padding: 6px 12px; border-radius: 8px; transform: rotate(4deg);
    font: 700 14px var(--text); letter-spacing: 0.05em; color: #fff; white-space: nowrap;
    background: #d23b3a; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
  }
  .stamp small { font-weight: 600; letter-spacing: 0; opacity: 0.85; }
  /* The card runs off the right and the bottom; the stats keep their words inside the edges. */
  .stats { left: 500px; top: 448px; width: 810px; padding: 10px 0 30px 10px; border-radius: 12px 0 0 0; }
  .stats img { display: block; width: 716px; }
</style>
</head>
<body>
  <div class="caption">
    <div class="app"><img src="../../docs/alphaverify-icon.svg" alt=""><span><b>Alpha<span class="brand">Verify</span></b><small>Trading-Signal Validation Framework</small></span></div>
    <h1>Looks like an edge?<br><span class="brand">Test it against noise.</span></h1>
    <p>Every trading signal is tested against 1,000 synthetic markets that contain no signal at all.</p>
    <div class="badges"><img src="../../docs/badge-cuda.svg" alt=""><img src="../../docs/badge-pypi.svg" alt=""></div>
  </div>

  <div class="paper figure back">
    <div class="crop"><img src="../../docs/bin_figure__ma_cross_50_200__bin_09.png" alt=""></div>
    <div class="stamp">NOT CLEARED <small>· 24.5 pts</small></div>
  </div>
  <div class="paper figure front">
    <div class="crop"><img src="../../docs/bin_figure__tnx_level__bin_01.png" alt=""></div>
    <div class="stamp">NOT CLEARED <small>· 42 pts</small></div>
  </div>
  <div class="paper stats"><img src="../../docs/stats-light.svg" alt=""></div>
<script>
  // The headline's wider line spans the caption's width, as on ZimAI's card.
  const h1 = document.querySelector("h1");
  h1.style.fontSize = "100px";
  h1.style.fontSize = 100 * document.querySelector(".caption").clientWidth / h1.getBoundingClientRect().width + "px";
</script>
</body>
</html>
