[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaverify"
version = "0.1.0"
description = "Conditional barrier-touch probability pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "yfinance>=0.2",
  "openpyxl>=3.1",
  "safetensors>=0.5",
  "torch>=2.0",
]

[project.scripts]
alphaverify = "alphaverify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
